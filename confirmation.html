<!DOCTYPE html>
<html lang="en" data-year="2024">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Confirmed | Climate Cardinals KNUST</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">
<main class="cc-auth">
  <div class="cc-auth__card cc-center" style="max-width:560px">
    <div class="cc-auth__badge" style="width:82px;height:82px"><span data-ico="checkCircle"></span></div>
    <h1 class="cc-display" style="font-size:clamp(1.9rem,4vw,2.6rem)">Thank you for your order!</h1>
    <p class="cc-lead cc-mt-s">Your support funds climate education and tree-planting across Kumasi. A confirmation has been noted for your email.</p>

    <div id="order-box" class="cc-card" style="padding:24px;text-align:left;margin:28px 0;display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span class="cc-label">Order Reference</span>
        <span id="order-id" style="font-family:monospace;font-weight:800;color:var(--primary)"></span>
      </div>
      <div id="order-items" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px"></div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;font-size:1.1rem">
        <b>Total</b><b id="order-total" style="color:var(--primary)"></b></div>
    </div>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="shop.html" class="cc-btn cc-btn--primary">Continue shopping</a>
      <a href="events.html" class="cc-btn cc-btn--ghost">Explore events</a>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/site.js"></script>
<script>
  (function () {
    var order;
    try { order = JSON.parse(sessionStorage.getItem('cc_last_order')); } catch (e) {}
    if (!order) return;
    document.getElementById('order-box').style.display = 'block';
    document.getElementById('order-id').textContent = '#' + String(order.id).slice(0, 8).toUpperCase();
    document.getElementById('order-total').textContent = 'GHS ' + Number(order.total).toFixed(2);
    var itemsEl = document.getElementById('order-items');
    (order.items || []).forEach(function (it) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;color:var(--ink-soft)';
      row.innerHTML = '<span>' + it.name + ' × ' + it.quantity + '</span><span>GHS ' + (Number(it.unitPrice) * it.quantity).toFixed(2) + '</span>';
      itemsEl.appendChild(row);
    });
    sessionStorage.removeItem('cc_last_order');
  })();
</script>
<script src="js/chrome.js"></script>
</body>
</html>
