<!DOCTYPE html>
<html lang="en" data-year="2024">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In | Climate Cardinals KNUST</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">
<main class="cc-auth">
  <div class="cc-auth__card">
    <div class="cc-center" style="margin-bottom:24px">
      <div class="cc-auth__badge"><span data-ico="leaf"></span></div>
      <h1 class="cc-h2">Welcome back</h1>
      <p class="cc-muted cc-mt-s">Sign in to your Climate Cardinals account</p>
    </div>
    <form id="login-form">
      <div class="cc-field"><label class="cc-label" for="email">Email address</label>
        <input id="email" name="email" class="cc-input" type="email" required autocomplete="email" placeholder="you@example.com"/></div>
      <div class="cc-field"><label class="cc-label" for="password">Password</label>
        <input id="password" name="password" class="cc-input" type="password" required autocomplete="current-password" placeholder="••••••••"/></div>
      <button type="submit" class="cc-btn cc-btn--primary cc-btn--block cc-btn--lg"><span data-ico="login"></span> Sign in</button>
      <p class="cc-center cc-muted" style="font-size:.9rem">New here? <a href="signup.html" style="color:var(--primary);font-weight:700">Create an account</a></p>
    </form>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/site.js"></script>
<script src="js/auth.js"></script>
<script src="js/chrome.js"></script>
</body>
</html>
