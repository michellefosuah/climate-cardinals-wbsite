# Render Blueprint — deploys the Climate Cardinals backend API + a managed
# PostgreSQL database in one step. See DEPLOYMENT.md for the walkthrough.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: climate-cardinals-db
    plan: free
    databaseName: climate_cardinals
    user: climate_cardinals

services:
  - type: web
    name: climate-cardinals-api
    runtime: node
    plan: free
    rootDir: backend
    # Install deps, generate the Prisma client, apply migrations, then seed.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: climate-cardinals-db
          property: connectionString
      # Render generates a strong secret for you.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Restrict this to your frontend origin once it is deployed, e.g.
      # https://michellefosuah.github.io
      - key: CORS_ORIGINS
        value: "*"
      # Bootstrap admin account created by the seed. Set the password in the
      # Render dashboard when prompted (kept out of source control).
      - key: SEED_ADMIN_EMAIL
        value: admin@climatecardinalsknust.org
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Chapter Admin
