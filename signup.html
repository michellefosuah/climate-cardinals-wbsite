<!DOCTYPE html>
<html lang="en" data-year="2024">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account | Climate Cardinals KNUST</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">
<main class="cc-auth">
  <div class="cc-auth__card">
    <div class="cc-center" style="margin-bottom:24px">
      <div class="cc-auth__badge"><span data-ico="userPlus"></span></div>
      <h1 class="cc-h2">Join the movement</h1>
      <p class="cc-muted cc-mt-s">Create your Climate Cardinals account</p>
    </div>
    <form id="signup-form">
      <div class="cc-field"><label class="cc-label" for="name">Full name</label>
        <input id="name" name="name" class="cc-input" type="text" required autocomplete="name" placeholder="Ama Mensah"/></div>
      <div class="cc-field"><label class="cc-label" for="email">Email address</label>
        <input id="email" name="email" class="cc-input" type="email" required autocomplete="email" placeholder="you@example.com"/></div>
      <div class="cc-field"><label class="cc-label" for="password">Password</label>
        <input id="password" name="password" class="cc-input" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"/></div>
      <button type="submit" class="cc-btn cc-btn--primary cc-btn--block cc-btn--lg"><span data-ico="userPlus"></span> Create account</button>
      <p class="cc-center cc-muted" style="font-size:.9rem">Already have an account? <a href="login.html" style="color:var(--primary);font-weight:700">Sign in</a></p>
    </form>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/site.js"></script>
<script src="js/auth.js"></script>
<script src="js/chrome.js"></script>
</body>
</html>
